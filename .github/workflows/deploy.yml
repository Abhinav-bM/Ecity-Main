name: deploy

on:
  push:
    branches: [main]

# A second push while a deploy is running should replace it, not race it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Deploy only what passes. Without this the workflow would happily ship a
  # build whose tests are failing, which is worse than not deploying at all.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A container registry rejects uppercase in an image name, and
      # github.repository keeps whatever case the repo was created with
      # (Abhinav-bM/Ecity-Main). Lowercase it or every push fails with
      # "invalid reference format".
      - name: Work out the image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      # Required before any build that uses cache-from/cache-to. Without it
      # build-push-action falls back to the default docker driver, which
      # cannot export a GitHub Actions cache, and buildx fails.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          push: true
          target: run
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration image
        uses: docker/build-push-action@v6
        with:
          push: true
          target: migrate
          tags: ${{ steps.image.outputs.name }}:migrate
          cache-from: type=gha

      - name: Migrate, sync roles, then release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ecity
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ecity/app
            docker compose pull

            # Migrations run to completion before anything new serves traffic.
            # No "|| true": a failed migration must stop the deploy, not leave
            # a new build talking to an old schema.
            docker compose run --rm migrate

            # A module that adds a permission has to reach roles that already
            # exist, or the new screen 403s for everyone.
            docker compose run --rm migrate npm run db:sync-roles

            # Plain "up -d", not "--wait": the app's healthcheck runs on a
            # 30s interval, so --wait can time out on a build that is fine.
            # The loop below is both faster and says what went wrong.
            docker compose up -d
            docker image prune -f
            # Ten tries at two seconds, asked from INSIDE the container: the
            # app exposes 3000 only on the Docker network, so curl on the host
            # would never connect.
            for i in $(seq 1 15); do
              if docker compose exec -T app node -e \
                   "fetch('http://localhost:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))"; then
                echo "healthy"
                exit 0
              fi
              sleep 2
            done
            echo "The deployed build never became healthy:"
            docker compose ps
            docker compose logs --tail=50 app
            exit 1
