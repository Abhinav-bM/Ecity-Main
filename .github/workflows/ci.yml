name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecity
          POSTGRES_PASSWORD: ecity
          POSTGRES_DB: ecity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://ecity:ecity@localhost:5432/ecity_test
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

      # The app is used on phones, tablets and desktops. Playwright runs every
      # suite at all four viewports; a desktop-only layout fails here.
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
        env:
          SEED_PASSWORD: ci-test-password-123
      - run: npm start &
      - run: npx wait-on http://localhost:3000/api/health --timeout 60000
      - run: npm run test:e2e
        env:
          SEED_PASSWORD: ci-test-password-123
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
