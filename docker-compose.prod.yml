# Production stack for the single Hetzner server (docs/04-Deployment-Guide.md).
# App, database and TLS proxy as three long-running containers on one machine,
# plus a migration container the deploy runs and throws away.
services:
  db:
    # Matches the version in docs/05-Database-Guide.md.
    image: postgres:17-alpine
    restart: unless-stopped
    # Tuned for a 1-2 GB VPS (docs/04 §1.4). The defaults assume a far bigger
    # machine and will get something OOM-killed at the worst moment.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    environment:
      POSTGRES_USER: ecity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecity
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecity']
      interval: 10s
      retries: 5
    # Never published to the internet - reachable only on the Docker network.

  app:
    image: ghcr.io/YOURNAME/ecity:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3

  # Run on demand by the deploy, never left running. Carries drizzle-kit and
  # tsx, which the app image deliberately does not.
  migrate:
    image: ghcr.io/YOURNAME/ecity:migrate
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    profiles: ['tools']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  db_data:
  caddy_data:
  caddy_config:
